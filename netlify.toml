[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/terms"
  to = "/Terms.dc.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/Privacy.dc.html"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/FAQ.dc.html"
  status = 200

[[edge_functions]]
  path = "/*"
  function = "block-bots"
