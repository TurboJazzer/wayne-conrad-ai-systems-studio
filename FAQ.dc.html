<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: {} };

  FAQS = [
    { section: "Core Service & Delivery", q: "What exactly do you deliver during a 7-to-14 day sprint?", a: "A fully functioning, automated pipeline built inside your existing tool stack — not a strategy deck, a PDF, or high-level advice. The deliverable includes configured agents, workflow logic, human approval gates where they matter, a written runbook, and a live team walkthrough." },
    { section: "Core Service & Delivery", q: "Which software platforms do you support?", a: "HubSpot, Asana, Microsoft 365, Google Workspace, Slack, n8n, Make, Salesforce, and Xero, among others. If your stack isn't listed, ask during the audit." },
    { section: "Core Service & Delivery", q: "How does a sprint work from start to finish?", a: "Day 1: 2-Hour Bottleneck Mapping. Days 2–4: Private Cloud & Integration Setup inside your accounts. Days 4–11: Custom Agentic Workflow Engineering. Days 12–14: Team Hand-Off & Zero-Lock-In Transfer." },
    { section: "Account Security, IP & Data Privacy", q: "Do you retain access to our accounts or data after hand-off?", a: "No. Zero lock-in is a firm policy: everything is built inside your own software accounts, and credentials never leave your control. Once handed over, you hold 100% ownership and every access key." },
    { section: "Account Security, IP & Data Privacy", q: "Is our business data used to train public AI models?", a: "No. Operational data stays inside private tenant environments or your own accounts and is never stored, retained, or used to train public LLMs." },
    { section: "Account Security, IP & Data Privacy", q: "What compliance standards do you adhere to?", a: "We process personal data in line with POPIA, GDPR, UK GDPR, CCPA/CPRA, the Australian Privacy Act, and Thailand's PDPA." },
    { section: "Pricing, Invoicing & Terms", q: "How does pricing work? Is it flat-rate or hourly?", a: "Flat-rate. Every sprint is billed on a fixed-fee basis, quoted and agreed before kick-off — no hourly billing and no surprise overages." },
    { section: "Pricing, Invoicing & Terms", q: "How and where are invoices issued?", a: "Contracts and invoices are issued by Wayne Conrad Advisory (Pty) Ltd, based in Cape Town, South Africa, and billed in USD or GBP via international wire transfer or major card processors." },
    { section: "Post-Hand-off & Ongoing Support", q: "What happens if a third-party API changes or breaks after delivery?", a: "Each sprint includes an included tuning period (30 to 90 days depending on tier) covering fixes from third-party API changes. Beyond that window, ongoing maintenance or future sprint additions can be scoped as a separate fixed-fee engagement." },
    { section: "Post-Hand-off & Ongoing Support", q: "How much time is required from my team during the sprint?", a: "About 2 hours for the initial bottleneck-mapping call, brief feedback check-ins while we test against your real data, and a 1-hour team hand-off session at the end." }
  ];

  renderVals() {
    const open = this.state.open;
    const groups = [];
    this.FAQS.forEach((f, i) => {
      let g = groups.find(g => g.section === f.section);
      if (!g) { g = { section: f.section, items: [] }; groups.push(g); }
      g.items.push({
        q: f.q, a: f.a,
        open: !!open[i],
        icon: open[i] ? "−" : "+",
        toggle: () => this.setState(s => ({ open: { ...s.open, [i]: !s.open[i] } }))
      });
    });
    return {
      faqGroups: groups,
      openCookies: () => { window.showCookieBanner && window.showCookieBanner(); }
    };
  }
}

</script>
